<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HA Blast Radius · Demo</title>
    <style>
      body {
        margin: 0;
        font-family: Roboto, Arial, sans-serif;
        background: #fafafa;
        color: #212121;
      }
      body.dark {
        color-scheme: dark;
        --primary-background-color: #111;
        --secondary-background-color: #262626;
        --card-background-color: #1c1c1c;
        --primary-text-color: #e8e8e8;
        --secondary-text-color: #aaa;
        --divider-color: #383838;
        --primary-color: #03a9f4;
        --success-color: #81c995;
        --warning-color: #f4c76a;
      }
      .demo-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #263238;
        color: #e1f5fe;
        padding: 9px 20px;
        font-size: 12px;
      }
      .demo-bar button {
        background: none;
        border: 1px solid #78909c;
        color: inherit;
        border-radius: 5px;
        padding: 5px 10px;
        cursor: pointer;
      }
      blast-radius-panel {
        height: calc(100vh - 46px);
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <span>DEMO · Synthetic configuration · No Home Assistant connection</span
      ><button id="theme">Toggle theme</button>
    </div>
    <blast-radius-panel></blast-radius-panel>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
