name: Sync panel preview patch
on:
  push:
    branches: [ui/panel-separator-polish]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --write 'src/*.ts' '*.ts' '*.json' 'test/*.ts' index.html
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Keep source and shipped frontend in sync
        run: |
          if git diff --quiet -- frontend/src/ frontend/test/ custom_components/blast_radius/frontend/; then
            echo 'Nothing to synchronize.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/ frontend/test/ custom_components/blast_radius/frontend/
          git commit -m 'build: sync preview retry handling'
          git push origin HEAD:ui/panel-separator-polish
