name: Validate HACS storefront polish
on:
  push:
    branches: [ui/hacs-storefront-scan-clarity]

permissions:
  contents: write

jobs:
  validate-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --write 'src/*.ts' '*.ts' '*.json' 'test/*.ts' index.html
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Commit formatted frontend sources and matching runtime bundle
        run: |
          if git diff --quiet -- frontend/src/ frontend/test/ custom_components/blast_radius/frontend/; then
            echo 'Frontend bundle is already in sync.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/ frontend/test/ custom_components/blast_radius/frontend/
          git commit -m 'build: sync reviewed scan diagnostics frontend'
          git push origin HEAD:ui/hacs-storefront-scan-clarity
