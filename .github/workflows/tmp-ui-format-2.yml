name: Temporary UI format 2

on:
  push:
    branches: [ui/relationship-model-overhaul]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[ui-format-2]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/relationship-model-overhaul
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --write 'src/*.ts' '*.ts' '*.json' 'test/*.ts' index.html
      - name: Commit formatting
        working-directory: .
        run: |
          git config user.name "Artur Panek"
          git config user.email "47123591+artur-panek@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: format relationship tests [ui-format-2]"
          git push origin HEAD:ui/relationship-model-overhaul
