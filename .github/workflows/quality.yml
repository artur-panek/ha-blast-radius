name: Quality
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,ha]'
      - run: ruff check . && ruff format --check . && mypy
      - run: pytest -q --cov --timeout=60
      - run: python scripts/check_package.py
      - run: python scripts/package_release.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check 'src/*.ts' '*.ts' '*.json' 'test/*.ts' index.html
      - run: npm run build
      - run: git diff --exit-code -- ../custom_components/blast_radius/frontend/
      - run: npx playwright install --with-deps chromium
      - run: node ../scripts/generate_brand.mjs
      - run: git diff --exit-code -- public/ ../custom_components/blast_radius/brand/
      - run: npm test

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          comment: false

  release:
    name: Publish version for HACS
    needs: [python, frontend, hassfest, hacs]
    if: >-
      github.repository == 'artur-panek/ha-blast-radius' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Publish an unreleased manifest version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_release.py
