name: Sync impact frontend bundle
on:
  push:
    branches:
      - ui/impact-polish-coverage

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Commit updated frontend bundle
        run: |
          if git diff --quiet -- custom_components/blast_radius/frontend/; then
            echo 'Frontend bundle is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/blast_radius/frontend/
          git commit -m 'build: sync generated frontend bundle'
          git push origin HEAD:ui/impact-polish-coverage
