name: Bug report
description: Incorrect reference, broken analysis, or panel issue
labels: [bug]
body:
  - type: input
    id: versions
    attributes: {label: HA and Blast Radius versions}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: For incorrect references, include a small synthetic configuration. Remove credentials, household details and installation paths.
    validations: {required: true}
  - type: textarea
    id: result
    attributes: {label: Expected and actual result}
    validations: {required: true}
  - type: textarea
    id: coverage
    attributes:
      label: Relevant coverage warnings or redacted report
      description: Include the selected entity and depth using synthetic names. Review exports and screenshots before attaching them.
  - type: input
    id: browser
    attributes:
      label: Browser or HA companion app
      description: For panel issues, include the browser/app version and whether this happens on desktop or mobile.
