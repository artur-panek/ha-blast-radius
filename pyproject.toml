[project]
name = "ha-blast-radius"
version = "0.2.4"
description = "Read-only dependency and impact analysis for Home Assistant"
authors = [{ name = "Artur Panek" }]
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1.6,<4"]

[project.urls]
Homepage = "https://artur.panek.tech/work/ha-blast-radius/"
Source = "https://github.com/artur-panek/ha-blast-radius"
Issues = "https://github.com/artur-panek/ha-blast-radius/issues"
Releases = "https://github.com/artur-panek/ha-blast-radius/releases"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "pytest-timeout>=2,<3", "ruff>=0.12,<1", "mypy>=1.16,<3"]
ha = [
  "homeassistant==2026.9.4; python_full_version >= '3.14.2'",
  "pytest-homeassistant-custom-component==0.13.367; python_full_version >= '3.14.2'",
  "home-assistant-frontend==20260826.7; python_full_version >= '3.14.2'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["custom_components/blast_radius/analysis"]
strict = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["custom_components/blast_radius/analysis"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.blast_radius" = ["*.json", "translations/*.json", "frontend/*.js", "brand/*.png"]
